<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mida</title>
    <script>
      // GitHub Pages serves this file for any URL it can't find.
      // We encode the requested path into a query string and redirect
      // to the real index.html, which will decode it and restore the URL.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/mida-app/?p=' + encodeURIComponent(l.pathname.replace('/mida-app', '') + l.search) +
        (l.hash || '')
      );
    </script>
  </head>
  <body></body>
</html>
